[package]
name = "enforce-abc"
version.workspace = true
edition.workspace = true
description = "Enforce the ABC input source on every macOS app activation."
license = "MIT"
repository = "https://github.com/0x6b/enforce-abc"
readme = "README.md"
keywords = ["macos", "keyboard", "input-source", "launchagent"]
categories = ["command-line-utilities"]
default-run = "enforce-abc"

[[bin]]
name = "enforce-abc"
path = "src/main.rs"

[workspace]
members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
cmd_lib = "2.0"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
log = "0.4"

[dependencies]
anyhow.workspace = true
clap.workspace = true
cmd_lib.workspace = true
dirs = "6.0"
env_logger.workspace = true
log.workspace = true

block2 = "0.6"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", features = [
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSThread",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
