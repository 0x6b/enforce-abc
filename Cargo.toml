[package]
name = "enforce-abc"
version = "1.0.0"
edition = "2024"
description = "Enforce a Latin keyboard input source on every app activation."
license = "MIT"
repository = "https://github.com/0x6b/enforce-abc"
readme = "README.md"
keywords = ["macos", "windows", "keyboard", "input-source"]
categories = ["command-line-utilities"]
default-run = "enforce-abc"

[[bin]]
name = "enforce-abc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", features = [
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSThread",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
